<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THUMBLY — K-POP Thumbnail Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Jost:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&family=Roboto+Condensed:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=SUIT:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div class="brand">THUMBLY <span>K-POP THUMBNAIL STUDIO</span></div><div class="head-actions"><button id="lang">日本語</button><button id="new">新規</button><button id="history">作成履歴</button><button class="primary" id="export">書き出す</button></div></header><main><aside class="left"><div class="tabs"><button class="tab active" data-tab="templates">テンプレート</button><button class="tab" data-tab="photo">画像</button><button class="tab" data-tab="advanced">詳細編集</button></div><div id="leftPanel"></div></aside><section class="workspace"><div class="workspace-top"><span id="templateName">テンプレート</span><div><button id="zoomOut">−</button><b id="zoom">100%</b><button id="zoomIn">＋</button></div></div><div class="stage-wrap"><div id="stage" class="stage"><canvas id="canvas" width="720" height="404"></canvas><div id="selection"></div></div></div><div class="workspace-bottom"><button id="refToggle">参考画像</button><button id="fit">中央配置</button><span>720 × 404 / 16:9</span></div></section><aside class="right"><div class="right-title"><b>レイヤー</b><button id="addT
