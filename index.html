<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THUMBLY — K-POP Thumbnail Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=Barlow+Condensed:wght@300;400;500;600;700;800;900&family=Bebas+Neue&family=Black+Han+Sans&family=DM+Sans:wght@400;500;600;700;800&family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Jua&family=League+Spartan:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Noto+Serif+JP:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&family=Roboto+Condensed:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Titillium+Web:wght@300;400;600;700;900&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><span class="brand-dot"></span><strong>THUMBLY</strong><em>STUDIO</em></div>
  <div class="doc-name" id="docName">Untitled thumbnail <button id="renameDoc">✎</button></div>
  <div class="top-actions"><select id="languageSelect" class="lang-select" aria-label="言語"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option></select>
    <button id="newProject" class="top-btn" data-i18n="new">新規</button><button id="saveProject" class="top-btn" data-i18n="save">保存</button>
    <button id="undoBtn" class="top-icon" title="Undo">↶</button><button id="redoBtn" class="top-icon" title="Redo">↷</button>
    <button id="projectsBtn" class="top-btn" data-i18n="projects">マイプロジェクト</button><button id="exportBtn" class="top-primary" data-i18n="export">書き出す</button>
  </div>
</header>
<div class="subbar">
  <div class="crumb"><span data-i18n="designStudio">デザインスタジオ</span><b>/</b><span id="templateLabel">MBC KPOP</span></div>
  <div class="sub-actions"><button id="compareBtn" data-i18n="beforeAfter">比較</button><button id="variantBtn" data-i18n="variants">バリエーション</button><button id="referenceBtn" data-i18n="referenceView">原稿を表示</button></div>
</div>
<main class="studio">
  <aside class="panel left-panel">
    <div class="panel-tabs"><button class="panel-tab active" data-left="templates" data-i18n="template">テンプレート</button><button class="panel-tab" data-left="elements" data-i18n="elements">素材</button><button class="panel-tab" data-left="uploads" data-i18n="photo">写真</button></div>
    <div id="leftContent"></div>
  </aside>

  <section class="canvas-area">
    <div class="canvas-toolbar">
      <div class="mode-pills"><button class="active" data-mode="edit" data-i18n="edit">編集</button><button data-mode="reference" data-i18n="reference">原稿</button></div>
      <div class="canvas-tools"><button id="gridBtn">▦</button><button id="safeBtn">◇</button><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button></div>
    </div>
    <div class="canvas-scroll"><div id="canvasFrame"><canvas id="canvas" width="720" height="404"></canvas><div id="compareOverlay" class="compare-overlay">ORIGINAL</div></div></div>
    <div class="canvas-status"><span>720 × 404 · 16:9</span><span id="statusText">準備完了</span><span>Shift＝軸固定 · 矢印＝1px</span></div>
  </section>

  <aside class="panel right-panel">
    <div class="right-head"><div><small data-i18n="layers">レイヤー</small><strong data-i18n="layerPanel">レイヤーパネル</strong></div><div class="layer-head-actions"><button id="addText" title="テキスト">T</button><button id="addGroup" title="グループ">＋▣</button></div></div>
    <div id="layersPanel" class="layers-panel"></div>
    <div class="layer-actions"><button id="layerUp">↑</button><button id="layerDown">↓</button><button id="layerDuplicate">複製</button><button id="layerDelete">削除</button></div>
    <div class="properties">
      <div class="prop-head"><span data-i18n="properties">プロパティ</span><b id="selectedName">未選択</b></div>
      <div id="propertiesBody"></div>
    </div>
  </aside>
</main>

<div id="toast" class="toast"></div>

<div id="exportModal" class="modal"><div class="modal-card export-card"><button class="modal-x" data-close="exportModal">×</button><div class="eyebrow">EXPORT</div><h2>書き出し</h2><p>用途に合わせて解像度と形式を選択。</p><div class="export-grid"><label>形式<select id="exportType"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WEBP</option></select></label><label>解像度<select id="exportScale"><option value="1">1× · 720×404</option><option value="2">2× · 1440×808</option><option value="3" selected>3× · 2160×1212</option><option value="4">4× · 2880×1616</option><option value="6">6× · 4320×2424</option></select></label><label class="full">品質 <output id="qualityOut">95%</output><input id="exportQuality" type="range" min="60" max="100" value="95"></label></div><div class="modal-actions"><button class="ghost" data-close="exportModal">キャンセル</button><button class="primary" id="doExport">ダウンロード</button></div></div></div>

<div id="historyModal" class="modal"><div class="modal-card wide-card"><button class="modal-x" data-close="historyModal">×</button><div class="eyebrow">MY PROJECTS</div><h2>マイプロジェクト</h2><p>ブラウザ内に保存した作品・プロジェクト。</p><div id="projectGrid" class="project-grid"></div></div></div>

<div id="variantModal" class="modal"><div class="modal-card wide-card"><button class="modal-x" data-close="variantModal">×</button><div class="eyebrow">VARIATIONS</div><h2>バリエーション</h2><p>同じ写真・文字から複数のデザイン案を作成。</p><div id="variantGrid" class="variant-grid"></div></div></div>

<script src="js/app.js"></script>
</body>
</html>
